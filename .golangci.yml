version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - depguard
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    # v1 blocklist, rewritten for depguard v2 (migrate drops it).
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: io/ioutil is deprecated. Use package io or os instead.
            - pkg: github.com/stretchr/testify/assert
              desc: github.com/stretchr/testify/require should be used instead.
    errorlint:
      asserts: false
      comparison: false
    gosec:
      excludes:
        - G107
    revive:
      rules:
        - name: bool-literal-in-expr
          disabled: false
        - name: early-return
          disabled: false
        - name: empty-lines
          disabled: false
        - name: struct-tag
          disabled: false
        - name: unexported-naming
          disabled: false
        - name: unused-parameter
          disabled: false
        - name: unused-receiver
          disabled: false
        - name: useless-break
          disabled: false
    staticcheck:
      checks:
        - all
        - -SA1019
        - -SA6002
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # revive v1.7+ checks validate options it does not know
      - linters:
          - revive
        text: 'struct-tag: unknown option .* in validate tag'
      # quick-fix suggestions; v1 did not run them
      - linters:
          - staticcheck
        text: '^QF\d+'
      # secret-pattern field names; new in gosec 2.22
      - linters:
          - gosec
        text: 'G117'
      # credential heuristics on test fixtures and test helpers
      - linters:
          - gosec
        path: '(_test\.go|(^|/)test/)'
        text: 'G101'
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
